<section id="participants" class="panel">
  <h2>Players <span class="muted small">{{ online_count }} online</span></h2>
  <ul class="participants">
    {% for player in players %}
      <li class="{% if player.online %}online{% else %}offline{% endif %}">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="name">
          {{ player.name }}
          {% if player.is_me %}<span class="muted small">(you)</span>{% endif %}
          {% if not player.online %}<span class="muted small">offline</span>{% endif %}
        </span>
        {% if room.revealed %}
          <span class="mini-card revealed">{{ player.card|default:"–" }}</span>
        {% elif player.has_voted %}
          <span class="mini-card voted" title="Voted">✓</span>
        {% else %}
          <span class="mini-card" title="Not voted yet"></span>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</section>
