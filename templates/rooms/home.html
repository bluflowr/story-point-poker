{% extends "base.html" %}

{% block content %}
  <header class="hero">
    <h1>Story Point Poker</h1>
    <p class="muted">Estimate stories together. Create a room, share the link, and vote.</p>
  </header>

  <form method="post" action="{% url 'rooms:create' %}" class="panel narrow">
    {% csrf_token %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% include "rooms/_deck_fields.html" %}
    <button type="submit" class="button primary">Create a room</button>
  </form>
{% endblock %}
