[project]
name = "poker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.2",
    "django>=5.2,<6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["rooms/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.uv.extra-build-variables]
# autobahn (pulled in by daphne, which channels' test helpers import) tries to
# compile optional C speedups and fails on Macs with a mismatched Xcode. The
# pure-Python build is fine for tests.
autobahn = { AUTOBAHN_USE_NVX = "0" }
